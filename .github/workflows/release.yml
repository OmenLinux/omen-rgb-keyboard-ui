name: Release

# Every push to main builds installers and publishes a GitHub Release.
# Version = 1.0.<commit-count> so electron-updater always sees a newer build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: release:linux
          - os: windows-latest
            script: release:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Set commit-tracking version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          # Semver patch tracks commit count (build metadata is ignored by updaters).
          VERSION="1.0.${COUNT}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Release version $VERSION (commit $SHORT_SHA)"

      - name: Build & publish
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Shown on the GitHub Release page
          RELEASE_NAME: OMEN Gaming Hub ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.sha }})
